
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    <title>Projeto-Conversor de Moeda</title>
</head>

<body>
   <img class="logo" src="./assets/logo.gif" alt="logo-projeto-conversor-de-moeda"> 

   <main>
    <label>
        Converter <b>de</b>
            <select>
                <option>Real Brasileiro</option>
            </select>
    </label>

    <label>
        Converter <b>para</b>
        <select class="currency-select">
            <option value="dolar">U$$ Dólar Americano</option>
            <option value="euro">€ Euro</option>
            <option value="libra">£ Libra</option>
        </select>
    </label>

    <label>
        Valor:
        <input id="input-currency" type="number" class="input-currency" placeholder="R$ 10.000,00"/>
    </label>
    
    <button class="convert-button">Converter</button> 

    <section>
        <div class="currency-box">
           <img src="./assets/Real.png" alt="Moeda Real"/> 
           <p class="currency">Real</p>
           <p class="currency-value-to-convert">R$ 0,00</p>
        </div>

        <img class="arrow-img" src="assets/arrow.png" alt="seta"/>

        <div class="currency-box">
            <img class="currency-img" src="./assets/Dolar.png" alt="logo-moeda-convertida"/>
            <p class="currency" id="currency-name">Dólar Americano</p>
            <p class="currency-value">U$$ 0,00</p>
        </div>

    </section>

   </main>
</body>
<script src="./Scripts.js"></script>
</html>
